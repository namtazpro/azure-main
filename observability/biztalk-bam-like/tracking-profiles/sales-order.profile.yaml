# Sales Order Tracking Profile
# Binds Microsoft Agent Framework agents to BAM milestones
# This is the equivalent of BizTalk's Tracking Profile Editor output
#
# The agents below are Azure AI Foundry agents (prompt-based and hosted)
# orchestrated by Microsoft Agent Framework.

activity: SalesOrder
version: "1.0"
description: >
  Maps agent lifecycle events from the Sales Order orchestration
  to BAM milestones. Agents are unaware of this tracking.

# Agent orchestration details
orchestration:
  framework: "Microsoft.Agents"
  project: "sales-order-processing"
  # This profile covers two orchestrations that together handle the full lifecycle
  orchestrations:
    - name: "OrderProcessingOrchestration"
      description: "Handles intake through approval"
      agents:
        - IntakeAgent
        - ValidationAgent
        - CreditCheckAgent
        - ApprovalAgent
    - name: "FulfilmentOrchestration"
      description: "Handles dispatch through invoicing (triggered by approval)"
      agents:
        - FulfilmentAgent
        - InvoiceAgent

# Bindings: map agent events to activity milestones
bindings:

  # ─── Orchestration 1: Order Processing ───────────────────────────────────

  - agent: IntakeAgent
    agent_type: foundry_prompt           # Azure AI Foundry prompt agent
    agent_id: "asst_intake_sales_v2"
    event: on_turn_complete              # Agent framework lifecycle event
    condition: "output.status == 'parsed'"  # Only trigger when parsing succeeds
    milestone: Received
    correlation:
      mint: true                         # This is where the token is minted
      division_source: "output.region_code"
      object_id_source: "output.order_id"
    data_mappings:
      OrderID:       "output.order_id"
      CustomerName:  "output.customer_name"
      CustomerID:    "output.customer_id"
      OrderAmount:   "output.total_amount"
      Currency:      "output.currency"
      Region:        "output.region_code"

  - agent: ValidationAgent
    agent_type: foundry_prompt
    agent_id: "asst_validation_catalog_v1"
    event: on_turn_complete
    condition: "output.validation_result != null"
    milestone: Validated
    correlation:
      mint: false
      lookup_by: "input.order_id"        # Find existing token by OrderID
    data_mappings:
      LineItemCount: "output.validated_line_count"
    # On failure: milestone is still recorded but with a failure flag
    on_failure:
      condition: "output.validation_result == 'failed'"
      milestone_status: "Failed"
      data_mappings:
        ValidationError: "output.error_reason"

  - agent: CreditCheckAgent
    agent_type: foundry_hosted           # Azure AI Foundry hosted agent (with tools)
    agent_id: "asst_credit_check_v3"
    event: on_turn_complete
    condition: "output.credit_decision != null"
    milestone: CreditChecked
    correlation:
      mint: false
      lookup_by: "input.order_id"
    data_mappings:
      CreditScore:  "output.credit_score"
      CreditLimit:  "output.credit_limit"

  - agent: ApprovalAgent
    agent_type: foundry_prompt
    agent_id: "asst_approval_routing_v1"
    event: on_turn_complete
    condition: "output.approval_decision != null"
    milestone: Approved
    correlation:
      mint: false
      lookup_by: "input.order_id"
    data_mappings:
      ApprovedBy:    "output.approved_by"
      ApprovalType:  "output.approval_type"

  # ─── Orchestration 2: Fulfilment ─────────────────────────────────────────
  # This runs as a separate orchestration, triggered asynchronously.
  # The correlation token is looked up from the activity store.

  - agent: FulfilmentAgent
    agent_type: foundry_hosted
    agent_id: "asst_fulfilment_warehouse_v2"
    event: on_turn_complete
    condition: "output.dispatch_confirmed == true"
    milestone: Dispatched
    correlation:
      mint: false
      lookup_by: "input.order_id"        # Cross-orchestration lookup
      lookup_scope: "active"             # Only search active instances
    data_mappings:
      CarrierName:     "output.carrier"
      TrackingNumber:  "output.tracking_number"

  - agent: InvoiceAgent
    agent_type: foundry_prompt
    agent_id: "asst_invoice_gen_v1"
    event: on_turn_complete
    condition: "output.invoice_number != null"
    milestone: Invoiced
    correlation:
      mint: false
      lookup_by: "input.order_id"
    data_mappings:
      InvoiceNumber: "output.invoice_number"

# Context propagation settings
context_propagation:
  # How the correlation token travels between agents within the same orchestration
  intra_orchestration:
    mechanism: "agent_context_metadata"
    key: "bam_correlation_token"
  
  # How the correlation token is resolved across different orchestrations
  inter_orchestration:
    mechanism: "activity_store_lookup"
    lookup_field: "OrderID"
    lookup_table: "bam_SalesOrder_Active"
