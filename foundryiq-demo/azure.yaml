# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: foundryiq-demo
services:
    travel-policy-agent:
        project: src/agent-framework-foundry-iq-knowledge-base-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLBOX_ENDPOINT: ${FULL_TOOLBOX_ENDPOINT}
            ENABLE_WORKIQ: "true"
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A corporate travel assistant grounded in Foundry IQ travel policies and Work IQ Mail.
        displayName: Travel Policy IQ Agent
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Foundry IQ
                - Knowledge Base
                - Agentic Retrieval
                - Azure AI Search
                - Work IQ
                - Travel
        name: travel-policy-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    web:
        project: src/web
        host: appservice
        language: python
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
infra:
    provider: microsoft.foundry
hooks:
    postprovision:
        posix:
            shell: sh
            run: ./src/agent-framework-foundry-iq-knowledge-base-responses/hooks/postprovision.sh
        windows:
            shell: pwsh
            run: ./src/agent-framework-foundry-iq-knowledge-base-responses/hooks/postprovision.ps1
